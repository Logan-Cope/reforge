[project]
name = "reforge"
version = "0.1.0"
description = "Agentic video RAG: recreate a reference reel's cut beat by beat from your own footage."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "supabase>=2.0",
  "numpy>=1.26",
  "scenedetect[opencv]>=0.6",
  "requests>=2.31",
  # vision / embeddings (heavy; install as needed)
  "open-clip-torch>=2.24",
  "torch>=2.2",
  "google-genai>=2.0",
  "anthropic>=0.39",
  # observability: LangSmith tracing on every Claude call (no-op without LANGSMITH_API_KEY)
  "langsmith>=0.4",
  # orchestration: thin StateGraph wrapper + human-review interrupt (src/reforge/graph.py)
  "langgraph>=1.2",
    "openai>=1.0",
  # quality layer (Phase 3.7): local CV signals + subject detection
  "opencv-python>=4.8",
  "mediapipe>=0.10",
  # review/curation web app (server-rendered FastAPI + Jinja + HTMX)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "datasets>=2.0"]
dev  = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes + the pycodestyle errors that catch real bugs; long lines are allowed
select = ["E4", "E7", "E9", "F", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
