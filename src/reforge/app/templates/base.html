<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>{% block title %}Reforge{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0c0e'/%3E%3Cpath d='M30 78V22h26a16 16 0 0 1 0 32H44l26 24h-16L30 54' fill='%23ff6a2b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/reforge.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
          crossorigin="anonymous"></script>
  <meta name="htmx-config" content='{"globalViewTransitions":true}'>
  <meta name="description" content="Reforge review app: an agentic RAG pipeline matches every beat of a reference reel to a creator's own footage, and a person approves each cut.">
</head>
<body{% if read_only %} class="read-only"{% endif %}>
  {% if read_only %}<div class="demo-ribbon" role="status">Read-only demo · synthetic data</div>{% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if read_only %}
  <script src="/static/read_only.js"></script>
  {% endif %}
</body>
</html>
